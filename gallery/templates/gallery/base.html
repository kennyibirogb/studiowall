{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.name }}{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<link rel="stylesheet" href="{% static 'gallery/style.css' %}">
</head>
<body class="{% block bodyclass %}{% endblock %}" {% block bodyattrs %}{% endblock %}>
<div id="spot"></div>
<nav class="acct">
  <a href="{% url 'gallery:commission' %}">Commission</a>

  {% if user.is_authenticated %}
    <a href="{% url 'gallery:orders' %}">My orders</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <input type="hidden" name="next" value="/">
      <button>Log out</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}?next={{ request.path }}">Log in</a>
    <a href="{% url 'gallery:signup' %}">Sign up</a>
  {% endif %}
</nav>
{% if messages %}<ul class="msgs">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
<script src="{% static 'gallery/app.js' %}" defer></script>
</body>
</html>
